name: Rust 3D Battle Chess

on:
  push:
    branches: [rust-3d-local]
    paths:
      - "rust-3d/**"
      - ".github/workflows/rust-3d-check.yml"
  pull_request:
    paths:
      - "rust-3d/**"
      - ".github/workflows/rust-3d-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-3d
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libwayland-dev libxkbcommon-dev
      - name: Format source in runner
        run: cargo fmt --all
      - name: Check
        run: cargo check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
