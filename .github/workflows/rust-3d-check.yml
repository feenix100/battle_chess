name: Rust 3D Battle Chess

on:
  push:
    branches: [rust-3d-local]
    paths:
      - "rust-3d/**"
      - ".github/workflows/rust-3d-check.yml"
  pull_request:
    paths:
      - "rust-3d/**"
      - ".github/workflows/rust-3d-check.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-3d
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libwayland-dev libxkbcommon-dev
      - name: Format
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          if ! git diff --quiet -- .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Format Rust 3D Battle Chess"
            git push origin HEAD:rust-3d-local
          fi
      - name: Check
        run: cargo check
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
